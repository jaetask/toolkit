name: publish
on:
  workflow_run:
    workflows: [auto-pr]
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: See whether this version is on npm
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "$name@$version is already on npm."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "$name@$version is not on npm yet."
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.new == 'true'
        run: npm install -g npm@latest
      - if: steps.version.outputs.new == 'true'
        run: npm ci
      - if: steps.version.outputs.new == 'true'
        run: npm run build
      - if: steps.version.outputs.new == 'true'
        name: Publish, and show npm's error in the run's annotations if it fails
        run: |
          set -o pipefail
          if ! npm publish 2>&1 | tee publish.log; then
            grep -E "npm (error|ERR)" publish.log | tail -8 | while IFS= read -r line; do echo "::error title=npm publish::$line"; done
            exit 1
          fi
