<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 764 362" width="100%" style="max-width:764px;height:auto" role="img" aria-label="A read page stacks sections; Edit opens that section&#x27;s own edit page in the same frame, and Back, Cancel or Save return to the same spot on the read page."><style>
svg { --paper:#fff; --ink:#0a0a0a; --muted:#525252; --accent:#0000ff; --tint:rgba(0,0,255,.05); --fill:rgba(10,10,10,.05); --line:rgba(10,10,10,.3);
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif }
@media (prefers-color-scheme: dark) { svg { --paper:#0d0d10; --ink:#f2f2f2; --muted:#a3a3a3; --accent:#8894ff; --tint:rgba(136,148,255,.12); --fill:rgba(255,255,255,.06); --line:rgba(255,255,255,.3) } }
.bg { fill: var(--paper) }
.n { fill: var(--paper); stroke: var(--ink) } .s { fill: var(--fill); stroke: var(--line) }
.f { fill: var(--tint); stroke: var(--accent); stroke-width: 1.2 } .o { fill: var(--paper); stroke: var(--ink); stroke-dasharray: 5 4 }
.t { fill: var(--ink) } .m { fill: var(--muted) } .a { fill: var(--accent) }
.e { stroke: var(--ink); stroke-width: 1.2; fill: none } .ea { stroke: var(--accent); stroke-width: 1.4; fill: none }
.hm { fill: var(--ink) } .ham { fill: var(--accent) }
</style><defs>
<marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="hm"/></marker>
<marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ham"/></marker>
</defs><rect class="bg" x="0" y="0" width="764" height="362"/><text x="20" y="22" class="t" font-size="13" font-weight="700" text-anchor="start">UX flow: read, edit, land back where you were</text><rect x="20" y="40" width="300" height="54" rx="6" class="s"/><text x="32" y="65" class="t" font-size="13" font-weight="700" text-anchor="start">Read page</text><text x="32" y="82" class="m" font-size="11" font-weight="400" text-anchor="start">full width, sections stacked</text><rect x="36" y="100" width="268" height="54" rx="6" class="n"/><text x="48" y="125" class="t" font-size="13" font-weight="700" text-anchor="start">Section: title, one line</text><text x="48" y="142" class="m" font-size="11" font-weight="400" text-anchor="start">rows of data, read-only</text><rect x="36" y="166" width="268" height="54" rx="6" class="n"/><text x="48" y="191" class="t" font-size="13" font-weight="700" text-anchor="start">Section: list</text><text x="48" y="208" class="m" font-size="11" font-weight="400" text-anchor="start">each row opens its own page</text><text x="232" y="122" class="a" font-size="12" font-weight="700" text-anchor="start">Edit</text><path d="M262,118 L420,118" class="ea" marker-end="url(#ha)"/><text x="322" y="108" class="m" font-size="11" font-weight="400" text-anchor="start">?from=this page</text><rect x="424" y="40" width="320" height="54" rx="6" class="s"/><text x="436" y="65" class="t" font-size="13" font-weight="700" text-anchor="start">Edit page, one section only</text><text x="436" y="82" class="m" font-size="11" font-weight="400" text-anchor="start">same width and frame as the read page</text><rect x="440" y="100" width="288" height="54" rx="6" class="n"/><text x="452" y="125" class="t" font-size="13" font-weight="700" text-anchor="start">Back (top)</text><text x="452" y="142" class="m" font-size="11" font-weight="400" text-anchor="start">returns to ?from, nothing saved</text><rect x="440" y="160" width="288" height="54" rx="6" class="n"/><text x="452" y="185" class="t" font-size="13" font-weight="700" text-anchor="start">Labelled rows</text><text x="452" y="202" class="m" font-size="11" font-weight="400" text-anchor="start">label + one line left, input right</text><rect x="440" y="220" width="288" height="54" rx="6" class="f"/><text x="452" y="245" class="a" font-size="13" font-weight="700" text-anchor="start">Cancel / Save (bottom)</text><text x="452" y="262" class="m" font-size="11" font-weight="400" text-anchor="start">both return to the same spot</text><path d="M440,248 L370,248 L370,130 L308,130" class="ea" marker-end="url(#ha)"/><text x="366" y="196" class="m" font-size="11" font-weight="400" text-anchor="end">back to</text><text x="366" y="210" class="m" font-size="11" font-weight="400" text-anchor="end">same spot</text><rect x="20" y="300" width="724" height="54" rx="6" class="o"/><text x="32" y="325" class="t" font-size="13" font-weight="700" text-anchor="start">One way in: no sheets, drawers, side panels, inline editors or settings pages</text><text x="32" y="342" class="m" font-size="11" font-weight="400" text-anchor="start">dialogs only confirm</text></svg>